version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      database-client:
        patterns:
          - prisma
          - "@prisma/client"
      queue-runtime:
        patterns:
          - bullmq
          - ioredis
      next-framework:
        patterns:
          - next
          - eslint-config-next
